schema_version: 1

context:
  name: fsvisual
  version: "0.0.2"
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/fsvisual-${{ version }}.tar.gz
  sha256: 751ef8c65f6d04a8f91703b2b63ff4d10ea5a63c74094790b90446d551fb710e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - fsvisual = fsvisual.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77.0.3
    - pip
  run:
    - python >=${{ python_min }}
    - pandas >=2.3.1
    - numpy >=2.3.1
    - trimesh >=4.7.4
    - pymeshlab >=2023.12.post3
    - scikit-image >=0.25.2
    - requests >=2.32.4
    - pymatgen >=2025.6.14
    - plotly >=6.3.0
    - shapely >=2.1.1
    - python-kaleido >=1.0.0

tests:
  - python:
      imports:
        - fsvisual
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - fsvisual --help

about:
  summary: A Fermi surface visualization package
  license: GPL-3.0-only
  license_file: LICENSE
  homepage: https://github.com/exciting/FSvisual

extra:
  recipe-maintainers:
    - jan-janssen
